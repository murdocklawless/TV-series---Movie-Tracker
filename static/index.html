<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Takip Listesi</title>
  <link rel="stylesheet" href="/static/style.css?v=22" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <nav>
    <div class="logo">
      <div class="logo-title">Dizi / Film Takip</div>
      <div class="logo-sub">Powered by DeepSeek V4</div>
    </div>
    <div class="tabs">
      <button id="tab-followed" class="tab active"><i class="fa-solid fa-list"></i> Takip Ettiklerim</button>
      <button id="tab-search" class="tab"><i class="fa-solid fa-magnifying-glass"></i> Ara &amp; Ekle</button>
      <button id="tab-settings" class="tab"><i class="fa-solid fa-gear"></i> Ayarlar</button>
    </div>
  </nav>

  <main>
    <!-- Followed view -->
    <section id="view-followed" class="view active">
      <div id="poster-grid" class="poster-grid"></div>
      <div id="empty-followed" class="empty">
        <p>Henüz takip ettiğiniz bir şey yok.</p>
        <p>Yayınlanmasını istediğiniz dizi ve filmleri ekleyin.</p>
      </div>
    </section>

    <!-- Search view -->
    <section id="view-search" class="view">
      <div class="search-bar">
        <input id="search-input" type="text" placeholder="Film veya dizi ara..." />
        <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>
      <div id="search-results" class="poster-grid"></div>
    </section>

    <!-- Settings view -->
    <section id="view-settings" class="view">
      <h2>Ayarlar</h2>
      <div class="settings-form">
        <label>TMDB API Key
          <input id="s-tmdb" type="text" placeholder="tmdb_api_key" />
        </label>
        <label>Telegram Bot Token
          <input id="s-token" type="text" placeholder="123456:ABC-DEF..." />
        </label>
        <label>Telegram Chat ID
          <input id="s-chat" type="text" placeholder="-100123456789" />
        </label>
        <label>Bildirim Saati (günlük)
          <input id="s-hour" type="time" value="09:00" />
        </label>
        <div class="settings-actions">
          <button id="save-settings" class="btn primary"><i class="fa-solid fa-floppy-disk"></i> Kaydet</button>
          <button id="test-settings" class="btn"><i class="fa-solid fa-paper-plane"></i> Test Mesajı Gönder</button>
        </div>
        <div id="settings-msg" class="msg"></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <!-- Releases modal -->
  <div id="releases-modal" class="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3 id="releases-title"></h3>
        <button id="releases-close" class="modal-close" title="Kapat">&times;</button>
      </div>
      <div id="releases-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Details modal -->
  <div id="details-modal" class="modal-overlay" style="display:none">
    <div class="modal details-modal">
      <div class="modal-header">
        <h3 id="details-title"></h3>
        <button id="details-close" class="modal-close" title="Kapat">&times;</button>
      </div>
      <div id="details-body" class="modal-body"></div>
    </div>
  </div>

  <script src="/static/app.js?v=19"></script>
</body>
</html>
