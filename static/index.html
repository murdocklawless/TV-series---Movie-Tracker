<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Takip Listesi</title>
  <link rel="stylesheet" href="/static/style.css?v=128" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <nav>
    <div class="logo">
      <div class="logo-title" data-i18n="logo_title">Dizi / Film Takip</div>
      <div class="logo-sub">Powered by DeepSeek V4</div>
    </div>
    <div class="tabs">
      <button id="tab-followed" class="tab active" data-i18n="tab_followed">Dizi &amp; Film</button>
      <button id="tab-anime" class="tab" data-i18n="tab_anime">Anime</button>
      <button id="tab-search" class="tab"><i class="fa-solid fa-magnifying-glass"></i> <span data-i18n="tab_search">Ara &amp; Ekle</span></button>
      <button id="tab-settings" class="tab"><i class="fa-solid fa-gear"></i></button>
    </div>
  </nav>

  <main>
    <!-- Followed view -->
    <section id="view-followed" class="view active">
      <div id="poster-grid" class="poster-grid"></div>
      <div id="empty-followed" class="empty">
        <p data-i18n="empty_1">Henüz takip ettiğiniz bir şey yok.</p>
        <p data-i18n="empty_2">Yayınlanmasını istediğiniz dizi ve filmleri ekleyin.</p>
      </div>
    </section>

    <!-- Anime view -->
    <section id="view-anime" class="view">
      <div id="anime-grid" class="poster-grid"></div>
      <div id="empty-anime" class="empty">
        <p data-i18n="anime_empty_1">Henüz takip ettiğiniz anime yok.</p>
        <p data-i18n="anime_empty_2">Ara &amp; Ekle sekmesinden Anime seçerek ekleyin.</p>
      </div>
    </section>

    <!-- Search view -->
    <section id="view-search" class="view">
      <div class="search-card">
        <div class="search-card-header">
          <h2 data-i18n="tab_search">Ara &amp; Ekle</h2>
          <button id="search-close" class="modal-close" data-tip="Kapat" data-i18n-title="close">&times;</button>
        </div>
        <div class="search-area">
          <div class="search-type-row">
            <select id="search-type">
              <option value="show" data-i18n="search_type_show">Dizi &amp; Film</option>
              <option value="anime" data-i18n="search_type_anime">Anime</option>
            </select>
          </div>
          <div class="search-bar">
            <input id="search-input" type="text" placeholder="Film veya dizi ara..." data-i18n="search_placeholder" />
            <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
          </div>
        </div>
        <div id="search-results" class="poster-grid"></div>
        <div id="anime-results" class="poster-grid" style="display:none"></div>
      </div>
    </section>

    <!-- Settings view -->
    <section id="view-settings" class="view">
      <div class="settings-card">
        <div class="settings-card-header">
          <h2 data-i18n="settings_title">Ayarlar</h2>
          <button id="settings-close" class="modal-close" data-tip="Kapat" data-i18n-title="close">&times;</button>
        </div>
        <div class="settings-form">
          <label><span data-i18n="label_lang">Uygulama Dili / TMDB Dili</span>
            <select id="s-lang">
              <option value="tr-TR">Türkçe</option>
              <option value="en-US">English</option>
              <option value="de-DE">Deutsch</option>
              <option value="fr-FR">Français</option>
              <option value="es-ES">Español</option>
              <option value="it-IT">Italiano</option>
              <option value="ru-RU">Русский</option>
              <option value="ar-SA">العربية</option>
              <option value="pt-BR">Português (BR)</option>
              <option value="nl-NL">Nederlands</option>
              <option value="pl-PL">Polski</option>
              <option value="ja-JP">日本語</option>
              <option value="ko-KR">한국어</option>
              <option value="zh-CN">中文</option>
            </select>
          </label>
          <label><span data-i18n="label_tz">Zaman Dilimi</span>
            <div class="tz-combobox">
              <input id="s-tz" type="text" placeholder="Yazın ve seçin..." autocomplete="off" data-i18n="tz_placeholder" />
              <div id="s-tz-list" class="tz-list" style="display:none"></div>
            </div>
          </label>
          <label><span data-i18n="label_tmdb">TMDB API Key</span>
            <input id="s-tmdb" type="text" placeholder="tmdb_api_key" />
          </label>
          <label><span data-i18n="label_token">Telegram Bot Token</span>
            <input id="s-token" type="text" placeholder="123456:ABC-DEF..." />
          </label>
          <label><span data-i18n="label_chat">Telegram Chat ID</span>
            <input id="s-chat" type="text" placeholder="-100123456789" />
          </label>
          <label><span data-i18n="label_ntfy">ntfy Konu</span>
            <input id="s-ntfy" type="text" placeholder="konu-adi" data-i18n="ntfy_placeholder" />
          </label>
          <label><span data-i18n="label_hour">Bildirim Saati (günlük)</span>
            <input id="s-hour" type="time" value="09:00" />
          </label>
          <div class="settings-actions">
            <button id="save-settings" class="btn primary"><span data-i18n="save">Kaydet</span></button>
            <button id="test-settings" class="btn"><i class="fa-solid fa-paper-plane"></i> <span data-i18n="test_message">Test Mesajı Gönder</span></button>
          </div>
          <div id="settings-msg" class="msg"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <!-- Releases modal -->
  <div id="releases-modal" class="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3 id="releases-title"></h3>
        <button id="releases-close" class="modal-close" data-tip="Kapat" data-i18n-title="close">&times;</button>
      </div>
      <div id="releases-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Details modal -->
  <div id="details-modal" class="modal-overlay" style="display:none">
    <div class="modal details-modal">
      <div class="modal-header">
        <h3 id="details-title"></h3>
        <div class="details-header-actions">
          <button id="details-calendar" class="modal-close" data-tip="Yayın takvimi" data-i18n-title="calendar_title">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </button>
          <button id="details-close" class="modal-close" data-tip="Kapat" data-i18n-title="close">&times;</button>
        </div>
      </div>
      <div id="details-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Confirm modal -->
  <div id="confirm-modal" class="modal-overlay" style="display:none">
    <div class="modal confirm-modal">
      <div class="modal-header">
        <h3 data-i18n="confirm_unfollow">Takibi Bırak</h3>
        <button id="confirm-close" class="modal-close" data-tip="Kapat" data-i18n-title="close">&times;</button>
      </div>
      <div id="confirm-body" class="modal-body">
        <p id="confirm-text" class="confirm-text"></p>
        <div class="confirm-actions">
          <button id="confirm-yes" class="btn confirm-danger" data-i18n="confirm_yes">Evet, Sil</button>
          <button id="confirm-no" class="btn" data-i18n="confirm_no">Vazgeç</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/app.js?v=83"></script>
</body>
</html>
